name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same interpreter production runs (.python-version; Nixpacks
      # reads the same file), not "whatever 3.12 is today".
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the locked dependencies
        # --no-deps: exactly what the lock names and nothing else, so the
        # next step can prove the lock is complete.
        run: pip install --no-deps -r requirements-dev.txt

      - name: The lockfile is complete and consistent
        # Fails when a locked package needs something the lock left out, or
        # a version another package refuses. Railway installs the same file.
        run: pip check

      - name: Compile every module
        run: python -m py_compile *.py

      - name: Theme-safety color lint
        run: python scripts/check_colors.py

      - name: Silent-failure lint
        run: python scripts/check_silent_handlers.py

      - name: Run tests
        # One worker per core; --dist loadfile keeps each file's tests on one
        # worker, so module-scoped fixtures (the app subprocesses) start once.
        run: pytest tests/ -n auto --dist loadfile -q
        env:
          # Tests must never touch real services; empty keys force every
          # AI/email path onto its offline fallback.
          ANTHROPIC_API_KEY: ""
          RESEND_API_KEY: ""
          # Every distinct statement the app runs, the run-time-built ones
          # included, for the postgres-recorded-sql job to PREPARE
          # (tests/conftest.py; blind re-audit 10/20/26 R9-02).
          CAVNAR_RECORD_SQL: ${{ runner.temp }}/recorded-sql

      - name: Keep the statements the suite ran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-sql
          path: ${{ runner.temp }}/recorded-sql
          if-no-files-found: warn
          retention-days: 3

  postgres:
    # The Postgres path, run against a real Postgres (blind re-audit
    # 10/11/26, SCALE-10: it had only ever run against a recording driver,
    # and the cutover's first boot would have failed). A throwaway server
    # with no data and no keys: the app's boot twice (in its own process),
    # the copy then the boot, every static statement PREPAREd, and EVERY
    # test file with each test's database on Postgres (tests/conftest.py,
    # CAVNAR_TEST_PG_URL) — built as production's was: the boot on SQLite,
    # pg_copy (month-partitioned fact tables), the boot again on Postgres.
    # It was a hand-picked list of ~40 files, and the notification badge's
    # Postgres-only failure (read 0 for every login after the cutover) sat
    # in a file that was not on it (blind re-audit 10/20/26 R9-01/R9-02).
    # What cannot run on Postgres is listed in ONE place, with its reason:
    # tests/conftest.py PG_MODE_SKIP_FILES and the sqlite_only marker.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ANTHROPIC_API_KEY: ""
      RESEND_API_KEY: ""
      CAVNAR_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the locked dependencies
        run: pip install --no-deps -r requirements-dev.txt
      - name: Every static statement PREPAREs on Postgres
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE cavnar_audit')"
          RAILWAY_VOLUME_MOUNT_PATH=$(mktemp -d) python scripts/pg_sql_audit.py --database-url postgresql://postgres:postgres@localhost:5432/cavnar_audit
      - name: Every test file on Postgres
        run: pytest tests/ -n auto --dist loadfile -q -p no:warnings

  postgres-recorded-sql:
    # Every statement the SQLite suite actually ran (the `test` job's
    # CAVNAR_RECORD_SQL), translated and PREPAREd on Postgres — the
    # run-time-built SQL (f-string holes, joined IN lists, CASEs built from
    # a registry) the source audit cannot read (blind re-audit 10/20/26
    # R9-02). A failure here is a statement that would fail in production.
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ANTHROPIC_API_KEY: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the locked dependencies
        run: pip install --no-deps -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: recorded-sql
          path: ${{ runner.temp }}/recorded-sql
      - name: Every statement the suite ran PREPAREs on Postgres
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE cavnar_audit')"
          RAILWAY_VOLUME_MOUNT_PATH=$(mktemp -d) python scripts/pg_sql_audit.py --database-url postgresql://postgres:postgres@localhost:5432/cavnar_audit --recorded ${{ runner.temp }}/recorded-sql

  audit:
    # Known-vulnerability scan of the locked dependencies. Non-blocking for
    # now (an advisory with no fix must not stop a deploy); read it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt
