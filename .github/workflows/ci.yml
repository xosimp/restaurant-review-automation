name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile every module
        run: python -m py_compile *.py

      - name: Theme-safety color lint
        run: python scripts/check_colors.py

      - name: Silent-failure lint
        run: python scripts/check_silent_handlers.py

      - name: Run tests
        # One worker per core; --dist loadfile keeps each file's tests on one
        # worker, so module-scoped fixtures (the app subprocesses) start once.
        run: pytest tests/ -n auto --dist loadfile -q
        env:
          # Tests must never touch real services; empty keys force every
          # AI/email path onto its offline fallback.
          ANTHROPIC_API_KEY: ""
          RESEND_API_KEY: ""

  audit:
    # Known-vulnerability scan of the pinned dependencies. Non-blocking for
    # now (an advisory with no fix must not stop a deploy); read it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements.txt
