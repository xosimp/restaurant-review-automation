name: Refresh season files

# The bundled season files (event_intel/seasons/*.json) refreshed from each
# team's published schedule every day: game times the leagues set or move,
# results, playoff games added (owner, 10/8/26: "nothing should have to be
# ran by hand"). A changed file is validated, the event tests run, then it
# is committed and pushed to main — never to `production` (audit #25 A01-20,
# A05-03). ONCE RAILWAY DEPLOYS THE `production` BRANCH, the commit reaches
# customers with the next promotion (scripts/promote.py), after its own gate
# run. UNTIL THEN a push to main still deploys at once, so the run is timed
# to land before lunch, never at dinner (blind re-audit 10/27/26 B1 F10: the
# 19:30 UTC run, started up to 3.7 hours late by GitHub, deployed at 6:15pm
# CT). A bot push made with this workflow's token starts no workflow, so the
# gate is dispatched for the commit explicitly. The app itself never calls
# these sources (owner, 10/1/26). A source that can't be read fails the run,
# so it shows red here, after the others were saved.

on:
  schedule:
    # 14:00 UTC = 9am Chicago in daylight time (8am in winter): GitHub's
    # usual 2-4 hour delay on a scheduled run still lands before the lunch
    # rush, and a time set for tonight is in before service.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # `gh workflow run ci.yml` for the bot's own commit.
  actions: write

concurrency:
  group: refresh-seasons
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Before the refresh, not after it: the script reads each source with
      # requests, and run without the lock it failed every source with "No
      # module named 'requests'" from 10/8 to 10/24/26.
      - name: Install the locked dependencies
        run: pip install --no-deps -r requirements-dev.txt

      - name: Refresh the season files
        id: refresh
        # Writes every file it could read; exits 1 if any source could not
        # be read (checked again at the end, after the commit).
        run: |
          set +e
          python scripts/refresh_seasons.py --write | tee refresh.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- event_intel/seasons; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
          {
            echo '### Season refresh'
            echo '```'
            cat refresh.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the refreshed files
        # Every season file is JSON the loader accepts, before anything else.
        if: steps.refresh.outputs.changed == '1'
        run: |
          python - <<'EOF'
          import glob, json, sys
          bad = []
          for path in sorted(glob.glob("event_intel/seasons/*.json")):
              try:
                  with open(path, encoding="utf-8") as fh:
                      json.load(fh)
              except Exception as e:
                  bad.append(f"{path}: {e}")
          print("\n".join(bad) or "every season file is valid JSON")
          sys.exit(1 if bad else 0)
          EOF

      - name: Check the refreshed files and run the event tests
        # What production will load: every file through the real loader, no
        # past game left scheduled, no stray whitespace (the live-file
        # checks), the merge rules — and every event_intel test.
        if: steps.refresh.outputs.changed == '1'
        run: pytest -q -p no:warnings -n auto --dist loadfile tests/test_event_*.py tests/test_refresh_seasons.py
        env:
          ANTHROPIC_API_KEY: ""
          RESEND_API_KEY: ""

      - name: Commit and push
        if: steps.refresh.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event_intel/seasons
          git commit -m "Season files refreshed $(date -u +%-m/%-d/%y) (daily, scripts/refresh_seasons.py)" \
                     -m "$(grep -E '^(  [~+?]|[a-z].*change)' refresh.log | head -40)"
          # main may have moved while this ran
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Gate the bot's commit
        # A push with this workflow's token starts no workflow, so the commit
        # would have no `gate` run and could never be promoted. A dispatch
        # is allowed.
        if: steps.refresh.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main

      - name: Fail if a source could not be read
        if: steps.refresh.outputs.status != '0'
        run: |
          grep -E 'could not read|Not refreshed' refresh.log || true
          exit 1
