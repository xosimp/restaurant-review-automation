<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify &mdash; Cavnar AI</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#edddd0 0%,#f2ece4 30%,#ede8df 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:white;border-radius:14px;padding:40px 36px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.08)}.logo{text-align:center;margin-bottom:28px;font-family:'DM Serif Display',serif;font-size:24px;color:#0e0c0a}.logo span{color:#c84b2f}h2{font-size:18px;font-weight:700;color:#0e0c0a;margin-bottom:8px;text-align:center}p{font-size:13px;color:#7a736a;text-align:center;margin-bottom:24px;line-height:1.6}.code-input{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.code-input input{width:46px;height:54px;text-align:center;font-size:24px;font-weight:700;border:2px solid #e0dbd0;border-radius:8px;font-family:monospace;color:#0e0c0a;outline:none;transition:border-color .15s}.code-input input:focus{border-color:#c84b2f}.btn{width:100%;padding:12px;background:#c84b2f;color:white;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:12px;transition:background .15s,box-shadow .15s,transform .15s}.btn:hover{background:#a83d25;box-shadow:0 4px 14px rgba(200,75,47,.32);transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn-link{width:100%;padding:10px;background:none;color:#7a736a;border:1px solid #e0dbd0;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .15s}.btn-link:hover{background:#f7f4ef;box-shadow:0 2px 8px rgba(14,12,10,.08);transform:translateY(-1px)}.btn-link:active{transform:scale(.97)}.error{color:#c0392b;font-size:13px;text-align:center;margin-bottom:16px;padding:10px;background:#fdf0ef;border-radius:6px;border:1px solid #f5c6c2}.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:#7a736a;margin-bottom:16px;justify-content:center;cursor:pointer}.hint{font-size:11px;color:#7a736a;text-align:center;margin-top:8px}</style></head><body><div class="card"><div class="logo"><svg viewBox="-6 -14 666 128" height="0.8em" style="vertical-align:-0.08em" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M53.43 101.49Q28.81 101.49 14.40 87.46Q0.00 73.43 0.00 50.00Q0.00 26.57 14.40 12.54Q28.81 -1.49 53.43 -1.49Q76.87 -1.49 90.67 9.48Q104.48 20.45 104.48 39.40V41.64H79.55V39.40Q79.55 29.40 73.43 24.70Q67.31 20.00 53.88 20.00Q37.31 20.00 30.52 26.72Q23.73 33.43 23.73 50.00Q23.73 66.57 30.52 73.28Q37.31 80.00 53.88 80.00Q67.31 80.00 73.43 75.30Q79.55 70.60 79.55 60.60V58.36H104.48V60.60Q104.48 79.55 90.67 90.52Q76.87 101.49 53.43 101.49Z"/><path d="M127.87 100.00H102.79L146.52 0.00H178.47L222.50 100.00H196.82L187.42 77.91H137.42ZM155.48 35.97 146.08 57.76H178.76L169.36 35.97L163.24 20.45H161.60Z"/><path d="M266.08 100.00H234.14L192.65 0.00H219.67L249.67 77.31H251.16L280.71 0.00H307.58Z"/><path d="M341.47 100.00H319.08V0.00H342.96L378.78 47.31L392.51 68.36H394.15L393.11 48.21V0.00H415.50V100.00H391.61L354.75 52.24L342.06 33.43H340.57L341.47 51.79Z"/><path d="M451.92 100.00H426.85L470.58 0.00H502.52L546.55 100.00H520.88L511.47 77.91H461.47ZM479.53 35.97 470.13 57.76H502.82L493.41 35.97L487.29 20.45H485.65Z"/><path d="M580.39 100.00H558.00V0.00H613.22Q631.73 0.00 641.80 7.84Q651.88 15.67 651.88 30.00Q651.88 55.07 623.67 57.76V58.96Q629.94 60.60 633.30 63.88Q636.65 67.16 639.79 73.13L654.27 100.00H628.30L614.56 74.03Q611.43 68.06 607.55 65.90Q603.67 63.73 595.16 63.73H580.39ZM580.39 20.15V46.87H613.07Q621.28 46.87 624.86 43.96Q628.45 41.04 628.45 33.43Q628.45 26.12 624.79 23.13Q621.13 20.15 613.07 20.15Z"/></svg><span style="font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:800;font-size:0.34em;letter-spacing:0.16em;color:#D4583A;vertical-align:0.62em;margin-left:0.12em;font-style:normal">AI</span></div><h2>Check your email</h2><p>We sent a 6-digit code to<br><strong>{{ masked_email }}</strong><br>Enter it below to sign in.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST" action="/verify-2fa" id="twofa-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="pending_token" value="{{ pending_token }}"><input type="hidden" name="next_url" value="{{ next_url }}"><div class="code-input"><input type="text" maxlength="1" id="c0" inputmode="numeric" autocomplete="one-time-code"><input type="text" maxlength="1" id="c1" inputmode="numeric"><input type="text" maxlength="1" id="c2" inputmode="numeric"><input type="text" maxlength="1" id="c3" inputmode="numeric"><input type="text" maxlength="1" id="c4" inputmode="numeric"><input type="text" maxlength="1" id="c5" inputmode="numeric"></div><input type="hidden" name="code" id="full-code"><label class="remember"><input type="checkbox" name="remember_device" id="remember" value="1" checked> Remember this device for 30 days</label><button type="submit" class="btn">Verify &rarr;</button><button type="button" class="btn-link" onclick="resendCode()">Resend code</button></form><p class="hint"><a href="/login" style="color:#7a736a">Back to login</a></p></div><script>var inputs=document.querySelectorAll('.code-input input');inputs.forEach(function(inp,i){  inp.addEventListener('input',function(){    if(inp.value.length===1&&i<5)inputs[i+1].focus();    var code='';inputs.forEach(function(x){code+=x.value;});    document.getElementById('full-code').value=code;    if(code.length===6){setTimeout(function(){document.getElementById('twofa-form').submit();},1200);}  });  inp.addEventListener('keydown',function(e){    if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus();  });  inp.addEventListener('paste',function(e){    var t=(e.clipboardData||window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,6);    for(var j=0;j<t.length;j++){if(inputs[j])inputs[j].value=t[j];}    document.getElementById('full-code').value=t;    if(t.length===6){setTimeout(function(){document.getElementById('twofa-form').submit();},1200);}    e.preventDefault();  });});inputs[0].focus();function resendCode(){  fetch('/resend-2fa',{method:'POST',headers:{'Content-Type':'application/json'},    body:JSON.stringify({pending_token:(document.querySelector('[name=pending_token]')||{}).value||''})})    .then(function(r){return r.json();}).then(function(d){      if(d.ok)alert('New code sent!');else alert('Could not resend. Try logging in again.');    });}</script></body></html>
