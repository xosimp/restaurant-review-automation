<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{ employee_name }} — {{ restaurant.name }}</title>
<link rel="stylesheet" href="/static/css/cavnar-buttons.css">
<style>
  :root{
    --paper:#0c0c0c; --card:#151515; --line:#262626;
    --ink:#f0ebe0; --ink2:#cdbfa9; --ink3:#8f847b;
    --ember:#d4583a; --ember2:#e8956a; --green:#4ead7a; --red:#e05555;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
       -webkit-font-smoothing:antialiased;padding:26px 18px 60px}
  .wrap{max-width:520px;margin:0 auto}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ember2)}
  h1{font-size:25px;line-height:1.15;margin:9px 0 3px;letter-spacing:-.01em}
  .sub{color:var(--ink3);font-size:14px;margin:0 0 22px}

  .tabs{display:flex;gap:7px;margin-bottom:20px}
  .tabs button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
               padding:10px 8px;color:var(--ink3);font-family:inherit;font-size:14px;
               font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--ember);border-color:var(--ember);color:#fff}

  section{display:none}
  section.on{display:block}

  h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
     color:var(--ember2);margin:24px 0 10px}
  h2:first-child{margin-top:0}

  .shift{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);
         border-radius:12px;padding:14px 16px;margin-bottom:9px}
  .shift.today{border-left-color:var(--green)}
  .shift.off{border-left-color:var(--line);opacity:.62}
  .shift .day{font-size:15px;font-weight:700}
  .shift .date{font-size:12.5px;color:var(--ink3);margin-left:6px;font-weight:400}
  .shift .time{font-size:18px;font-weight:700;margin-top:6px}
  .shift .meta{font-size:13px;color:var(--ink2);margin-top:3px}
  .shift .none{font-size:14px;color:var(--ink3);margin-top:5px}

  .task{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .task input{width:20px;height:20px;flex-shrink:0;accent-color:var(--ember)}
  .task span{font-size:15.5px}
  .task.done span{text-decoration:line-through;color:var(--ink3)}
  .progress{font-size:13px;color:var(--ink3);margin-bottom:10px}

  .row{background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:13px 15px;margin-bottom:8px;display:flex;justify-content:space-between;
       align-items:center;gap:10px}
  .row .k{font-size:13px;color:var(--ink3)}
  .row .v{font-size:15px;font-weight:600}

  .empty{background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:18px;color:var(--ink3);font-size:14px;line-height:1.55}
  .load{color:var(--ink3);font-size:14px;padding:8px 0}
  .err{color:var(--red);font-size:14px}

  .brief{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember2);
         border-radius:12px;padding:14px 16px;margin-bottom:22px}
  .brief .item{font-size:14.5px;line-height:1.5;padding:6px 0;border-top:1px solid var(--line)}
  .brief .item:first-of-type{border-top:0}
  .brief .tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
              color:var(--ink3);display:block;margin-bottom:2px}

  .pinform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .pinform label{display:block;font-size:13px;color:var(--ink3);margin:10px 0 5px}
  .pinform input{width:100%;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;
                 padding:11px 13px;color:var(--ink);font-family:inherit;font-size:17px;
                 letter-spacing:.18em}
  .pinmsg{font-size:13.5px;margin-top:10px}
  footer{margin-top:34px;text-align:center}
.av-days{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.to-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.to-st{font-size:12px;color:var(--ink3);white-space:nowrap}
.av-row{display:flex;align-items:center;gap:10px;margin-top:8px}
#avail-notes{width:100%;padding:9px 12px;border:1px solid var(--paper3);border-radius:8px;font:inherit;color:var(--ink);background:var(--paper)}
  /* Shift requests: a shift you can't work, and the open ones you can take */
  .shift .drop{margin-top:8px}
  .sr-row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .sr-row .when{font-size:15px;font-weight:600}
  .sr-row .meta{font-size:13px;color:var(--ink2);margin-top:3px}
  .sr-row .st{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--ink3)}
  .sr-row .st.open,.sr-row .st.covered{color:var(--green)}
  .sr-row .st.denied{color:var(--red)}
  .sr-row .st.pending{color:var(--ember2)}
  .sr-row .act{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .sr-row.open-shift{border-left:3px solid var(--ember2)}
  .sr-msg{font-size:13.5px;margin-top:6px;color:var(--red)}
  .sr-row .kind{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ember2);margin-right:6px}
  /* Swap with a colleague: a small picker under the shift */
  .shift .brk{font-size:13px;color:var(--ink3);margin-top:3px}
  .shift .drop{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .swap-pick{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
  .swap-pick label{display:block;font-size:12.5px;color:var(--ink3);margin:8px 0 4px}
  .swap-pick label:first-child{margin-top:0}
  .swap-pick select,.swap-pick input{width:100%;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:15px}
  .swap-pick .act{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .swap-pick .msg{font-size:13px;color:var(--red)}
  /* What I'd like: a wish, not a rule */
  .pref-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px}
  .pref-hrs{display:flex;gap:10px;align-items:center;margin:8px 0 10px}
  .pref-hrs input{width:90px;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font-family:inherit;font-size:16px;text-align:center}
  .pref-note{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
  /* The 14-hour shift session ended: say so once, with the way back in. */
  .ended{display:none;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ember);
         border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:14.5px;line-height:1.5}
  .ended.on{display:block}
  .ended .cbtn{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">{{ restaurant.name }}</div>
  <h1>{{ employee_name }}</h1>
  <p class="sub" id="today-line">&nbsp;</p>

  <div class="ended" id="session-ended" role="alert">
    Your shift session ended, so nothing here is up to date. Sign in again to carry on.
    <div><a class="cbtn cbtn-primary cbtn-sm" href="{{ signin_url }}">Sign in again</a></div>
  </div>

  <div class="tabs">
    <button type="button" class="on" data-tab="schedule">Schedule</button>
    <button type="button" data-tab="tasks">Tasks</button>
    <button type="button" data-tab="profile">Profile</button>
  </div>

  <section id="tab-schedule" class="on">
    <div id="brief-body"></div>
    <div id="sched-body" class="load">Loading your shifts…</div>
    <div id="req-body"></div>
  <div id="avail-body" class="card"></div>
  <div id="pref-body" class="card"></div>
  <div id="timeoff-body" class="card"></div>
  </section>

  <section id="tab-tasks">
    <div id="tasks-body" class="load">Loading your tasks…</div>
  </section>

  <section id="tab-profile">
    <div id="profile-body" class="load">Loading…</div>
    <h2>Change your PIN</h2>
    <div class="pinform">
      <label for="cur">Current PIN</label>
      <input id="cur" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
      <label for="nw">New PIN</label>
      <input id="nw" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
      <label for="nw2">Confirm new PIN</label>
      <input id="nw2" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
      <div style="margin-top:14px">
        <button type="button" class="cbtn cbtn-primary" onclick="savePin()">Save new PIN</button>
      </div>
      <div class="pinmsg" id="pinmsg"></div>
    </div>
    <footer>
      <form method="post" action="/staff/logout" style="display:inline"><button type="submit" class="cbtn cbtn-secondary">Sign out</button></form>
    </footer>
  </section>
</div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  /* The checklist day is the restaurant's, never this phone's: the server
     picks it (its own time zone) when it sends the list, and a check-off
     is recorded against the day of the list the employee is looking at. */
  var taskDate = '';
  function today(){
    return taskDate;
  }

  /* Every call here needs the shift session. When it ends (14 hours, or a
     PIN change on another device) the API answers 401 session_expired;
     show one way back to the sign-in pad instead of a page of
     "Could not load" lines that no retry can fix. */
  var _fetch = window.fetch;
  function sessionEnded(){
    var box = $('session-ended');
    if (box && box.className.indexOf(' on') < 0) { box.className += ' on'; window.scrollTo(0, 0); }
  }
  window.fetch = function(){
    return _fetch.apply(window, arguments).then(function(r){
      if (r.status !== 401) return r;
      return r.clone().json().then(function(d){
        if (d && d.session_expired) sessionEnded();
        return r;
      }, function(){ return r; });
    });
  };

  /* A short line under the control that failed, in place of a dialog. */
  function inlineMsg(el, text){
    var host = el && el.parentNode; if (!host) return;
    var m = null;
    for (var i = 0; i < host.childNodes.length; i++) {
      if (host.childNodes[i].className === 'sr-msg') { m = host.childNodes[i]; break; }
    }
    if (!m) { m = document.createElement('div'); m.className = 'sr-msg'; host.appendChild(m); }
    m.textContent = text || '';
  }

  var tabs = document.querySelectorAll('.tabs button');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function(){
      for (var j = 0; j < tabs.length; j++) tabs[j].className = '';
      this.className = 'on';
      var want = this.getAttribute('data-tab');
      var secs = document.querySelectorAll('section');
      for (var k = 0; k < secs.length; k++) {
        secs[k].className = (secs[k].id === 'tab-' + want) ? 'on' : '';
      }
    });
  }

  // ── Before service ──────────────────────────────────────────────────────
  // Staff-safe by construction (preshift.py): relative volume, what guests
  // have raised, what is running low. No money, no names. An empty or failed
  // briefing shows nothing rather than an error — it is a bonus, not the page.
  var BRIEF_TAGS = {volume: 'Volume', watch: 'Watch', stock: '86 risk', event: 'Today', weather: 'Weather'};
  fetch('/staff/api/preshift').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok || !d.items || !d.items.length) return;
    var html = '<h2>Before service</h2><div class="brief">';
    for (var i = 0; i < d.items.length; i++) {
      var it = d.items[i];
      html += '<div class="item"><span class="tag">' + esc(BRIEF_TAGS[it.kind] || it.kind) + '</span>'
            + esc(it.text) + '</div>';
    }
    $('brief-body').innerHTML = html + '</div>';
  }).catch(function(){});

  // ── Schedule ────────────────────────────────────────────────────────────
  function mdyShort(iso) {
    // 9/21/26 — the one date format an owner or employee sees (DESIGN_SYSTEM → Dates and times).
    if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return esc(iso || '');
    return (+iso.slice(5, 7)) + '/' + (+iso.slice(8, 10)) + '/' + iso.slice(2, 4);
  }
  function renderShifts(d){
    var el = $('sched-body');
    if (!d.ok) { el.className = 'err'; el.textContent = 'Could not load your shifts.'; return; }
    el.className = '';
    if (!d.published) {
      el.innerHTML = '<div class="empty">Your manager hasn\u2019t published next week yet. '
                   + 'Your shifts show up here the moment it goes out.</div>';
      $('today-line').textContent = '';
      return;
    }
    // The shifts API names them start / end / hours (labor.employee_shifts_from_csv).
    function sStart(s) { return s.start || s.shift_start || ''; }
    function sEnd(s) { return s.end || s.shift_end || ''; }
    // A double is two legs on one day; show every one of them.
    var todayLegs = d.today ? (d.today.legs || [d.today]) : [];
    var todayText = [];
    for (var t = 0; t < todayLegs.length; t++) todayText.push(sStart(todayLegs[t]) + ' – ' + sEnd(todayLegs[t]));
    $('today-line').textContent = todayLegs.length
      ? 'Today: ' + todayText.join(' and ')
      : "You're off today.";

    var html = '<h2>Next 7 days</h2>';
    for (var i = 0; i < d.week.length; i++) {
      var day = d.week[i];
      var legs = day.shifts || (day.shift ? [day.shift] : []);
      var cls = 'shift' + (day.is_today ? ' today' : '') + (day.off ? ' off' : '');
      html += '<div class="' + cls + '">'
            + '<div><span class="day">' + esc(day.weekday) + '</span>'
            + '<span class="date">' + mdyShort(day.date) + (day.is_today ? ' · today' : '') + '</span></div>';
      for (var j = 0; j < legs.length; j++) {
        var s = legs[j];
        var hrs = s.hours || s.scheduled_hours;
        html += '<div class="time">' + esc(sStart(s)) + ' – ' + esc(sEnd(s)) + '</div>'
              + '<div class="meta">' + esc(s.role || '')
              + (hrs ? ' · ' + esc(hrs) + 'h' : '') + '</div>';
        if (s['break']) html += '<div class="brk">Break ' + esc(s['break']) + '</div>';
        if (s.notes) html += '<div class="meta">' + esc(s.notes) + '</div>';
        // A published shift you can't make: ask to drop it, or swap it
        // with a colleague's. A manager answers either one.
        html += '<div class="drop"><button type="button" class="cbtn cbtn-text cbtn-sm" data-drop-date="' + esc(day.date) + '" data-drop-start="' + esc(sStart(s)) + '">Can\u2019t work this</button>'
              + '<button type="button" class="cbtn cbtn-text cbtn-sm" data-swap-date="' + esc(day.date) + '" data-swap-start="' + esc(sStart(s)) + '">Swap with a colleague</button></div>';
      }
      if (legs.length) {
        html += '<div class="swap-slot" id="swap-' + esc(day.date) + '"></div>';
      } else {
        html += '<div class="none">Off</div>';
      }
      html += '</div>';
    }
    el.innerHTML = html;
  }
  fetch('/staff/api/shifts').then(function(r){ return r.json(); }).then(renderShifts).catch(function(){
    $('sched-body').className = 'err';
    $('sched-body').textContent = 'Could not load your shifts.';
  });

  // ── Shift requests ──────────────────────────────────────────────────────
  // Mine, with where each one stands, and the open shifts anybody on the
  // roster can take. The server decides whether a claim is legal (rest,
  // hours, availability) and says why when it is not. ES5 only.
  var REQ_STATUS = {pending: 'Waiting for an answer', open: 'Approved \u2014 open for someone to claim',
                    approved: 'Approved \u2014 waiting on your colleague to accept',
                    denied: 'Not approved', declined: 'Your colleague said no', covered: 'Covered', withdrawn: 'Withdrawn'};
  function fmtShort(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return esc(iso || '');
    var d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
    if (isNaN(d)) return esc(iso);
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(-2);
  }
  function reqRender(d) {
    var el = $('req-body'); if (!el) return;
    var mine = d.requests || [], open = d.open || [], asks = d.asks || [], html = '', i;
    // A colleague asked to trade with you: nothing moves unless you say yes.
    if (asks.length) {
      html += '<h2>Asked of you</h2>';
      for (i = 0; i < asks.length; i++) {
        var a = asks[i];
        html += '<div class="sr-row"><div class="when"><span class="kind">Swap</span>' + esc(a.employee_name) + '\u2019s ' + fmtShort(a.date) + ' ' + esc(a.shift_start)
              + ' for your ' + fmtShort(a.target_date) + ' ' + esc(a.target_start || '') + '</div>'
              + (a.reason ? '<div class="meta">' + esc(a.reason) + '</div>' : '')
              + '<div class="meta">' + (a.status === 'approved' ? 'Your manager approved it \u2014 it goes ahead if you accept.' : 'Your manager decides too; both shifts move only when you and they say yes.') + '</div>'
              + '<div class="act"><button type="button" class="cbtn cbtn-primary cbtn-sm" data-swap-accept="' + a.id + '">Accept</button>'
              + '<button type="button" class="cbtn cbtn-text cbtn-sm" data-swap-decline="' + a.id + '">Decline</button></div>'
              + '<div class="sr-msg" id="ask-msg-' + a.id + '"></div></div>';
      }
    }
    if (mine.length) {
      html += '<h2>My requests</h2>';
      for (i = 0; i < mine.length; i++) {
        var q = mine[i], st = q.status || 'pending', swap = (q.kind || 'drop') === 'swap';
        var label = REQ_STATUS[st] || st;
        if (st === 'covered' && q.replacement_name) label = swap ? 'Swapped' : 'Covered by ' + q.replacement_name;
        // A swap names both shifts: mine, and the colleague's I asked for.
        var when = swap
          ? '<span class="kind">Swap</span>my ' + fmtShort(q.date) + ' ' + esc(q.shift_start) + ' for ' + esc(q.target_name || '') + '\u2019s ' + fmtShort(q.target_date) + ' ' + esc(q.target_start || '')
          : '<span class="kind">Drop</span>' + fmtShort(q.date) + ' \u00B7 ' + esc(q.shift_start) + (q.shift_end ? ' \u2013 ' + esc(q.shift_end) : '');
        html += '<div class="sr-row"><div class="when">' + when + '</div>'
              + (q.role || q.reason ? '<div class="meta">' + esc(q.role || '') + (q.role && q.reason ? ' \u00B7 ' : '') + esc(q.reason || '') + '</div>' : '')
              + '<div class="st ' + esc(st) + '">' + esc(label) + '</div>';
        if (st === 'pending' || st === 'open' || st === 'approved') {
          html += '<div class="act"><button type="button" class="cbtn cbtn-text cbtn-sm" data-withdraw="' + q.id + '">Withdraw</button></div>';
        }
        html += '</div>';
      }
    }
    html += '<h2>Open shifts</h2>';
    if (!open.length) {
      html += '<div class="empty">No open shifts right now. When a teammate can\u2019t work one and your manager approves it, it shows up here for you to take.</div>';
    }
    for (i = 0; i < open.length; i++) {
      var o = open[i];
      html += '<div class="sr-row open-shift" id="open-' + o.id + '"><div class="when">' + fmtShort(o.date) + ' \u00B7 ' + esc(o.shift_start) + (o.shift_end ? ' \u2013 ' + esc(o.shift_end) : '') + '</div>'
            + '<div class="meta">' + esc(o.role || '') + (o.role ? ' \u00B7 ' : '') + 'was ' + esc(o.employee_name) + '</div>'
            + '<div class="act"><button type="button" class="cbtn cbtn-primary cbtn-sm" data-claim="' + o.id + '">Take this shift</button></div>'
            + '<div class="sr-msg" id="open-msg-' + o.id + '"></div></div>';
    }
    el.innerHTML = html;
  }
  function loadRequests() {
    fetch('/staff/api/shift-requests').then(function (r) { return r.json(); }).then(function (d) { if (d && d.ok) reqRender(d); }).catch(function () {});
  }
  loadRequests();
  function post(url, body) {
    return fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})})
      .then(function (r) { return r.json().catch(function () { return {ok: false, error: 'Something went wrong \u2014 try again.'}; }); });
  }
  // ── Swap with a colleague ───────────────────────────────────────────────
  // Who else is on the published week and their shifts, fetched once; a
  // small picker under the shift builds the request. The server judges
  // whether both sides are legal when a manager approves it.
  var _colleagues = null;
  function loadColleagues(cb) {
    if (_colleagues) { cb(_colleagues); return; }
    fetch('/staff/api/colleagues').then(function (r) { return r.json(); }).then(function (d) {
      _colleagues = (d && d.ok && d.colleagues) || [];
      cb(_colleagues);
    }).catch(function () { cb([]); });
  }
  function shiftLabel(s) { return fmtShort(s.date) + ' ' + s.shift_start + (s.shift_end ? ' – ' + s.shift_end : '') + (s.role ? ' · ' + s.role : ''); }
  function openSwapPicker(date, start) {
    var slot = $('swap-' + date); if (!slot) return;
    if (slot.innerHTML) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<div class="swap-pick"><div class="load">Loading who’s on this week…</div></div>';
    loadColleagues(function (list) {
      if (!list.length) { slot.innerHTML = '<div class="swap-pick"><div class="meta">Nobody else is on the published week yet.</div></div>'; return; }
      var html = '<div class="swap-pick"><label for="swap-who-' + esc(date) + '">Swap with</label><select id="swap-who-' + esc(date) + '" data-swap-who="' + esc(date) + '">';
      for (var i = 0; i < list.length; i++) html += '<option value="' + i + '">' + esc(list[i].name) + '</option>';
      html += '</select><label for="swap-their-' + esc(date) + '">For their shift</label><select id="swap-their-' + esc(date) + '"></select>'
            + '<label for="swap-why-' + esc(date) + '">Why (optional)</label><input type="text" id="swap-why-' + esc(date) + '" maxlength="200" placeholder="e.g. a class that night">'
            + '<div class="act"><button type="button" class="cbtn cbtn-primary cbtn-sm" data-swap-send="' + esc(date) + '" data-swap-start="' + esc(start) + '">Ask for the swap</button>'
            + '<button type="button" class="cbtn cbtn-text cbtn-sm" data-swap-cancel="' + esc(date) + '">Cancel</button><span class="msg" id="swap-msg-' + esc(date) + '"></span></div></div>';
      slot.innerHTML = html;
      fillTheirShifts(date);
    });
  }
  function fillTheirShifts(date) {
    var who = $('swap-who-' + date), their = $('swap-their-' + date);
    if (!who || !their || !_colleagues) return;
    var c = _colleagues[+who.value] || {shifts: []}, html = '';
    for (var i = 0; i < c.shifts.length; i++) html += '<option value="' + i + '">' + esc(shiftLabel(c.shifts[i])) + '</option>';
    their.innerHTML = html || '<option value="">No shifts this week</option>';
  }
  document.addEventListener('change', function (ev) {
    var el = ev.target; if (!el || !el.getAttribute) return;
    var d = el.getAttribute('data-swap-who'); if (d) fillTheirShifts(d);
  });
  document.addEventListener('click', function (ev) {
    var el = ev.target;
    while (el && el !== document.body && !(el.getAttribute && (el.getAttribute('data-drop-date') || el.getAttribute('data-withdraw') || el.getAttribute('data-claim') || el.getAttribute('data-swap-date') || el.getAttribute('data-swap-send') || el.getAttribute('data-swap-cancel') || el.getAttribute('data-swap-accept') || el.getAttribute('data-swap-decline')))) el = el.parentNode;
    if (!el || !el.getAttribute) return;
    var acc = el.getAttribute('data-swap-accept'), dec = el.getAttribute('data-swap-decline');
    if (acc || dec) {
      var askId = acc || dec, askMsg = $('ask-msg-' + askId);
      if (askMsg) askMsg.textContent = '';
      el.disabled = true;
      post('/staff/api/shift-requests/' + askId + '/respond', {accept: !!acc}).then(function (d) {
        if (!d.ok) { el.disabled = false; if (askMsg) askMsg.textContent = d.error || 'Could not answer that.'; return; }
        loadRequests();
        fetch('/staff/api/shifts').then(function (r) { return r.json(); }).then(renderShifts).catch(function () {});
      }).catch(function () { el.disabled = false; if (askMsg) askMsg.textContent = 'Could not answer that \u2014 check your connection.'; });
      return;
    }
    var drop = el.getAttribute('data-drop-date'), wd = el.getAttribute('data-withdraw'), cl = el.getAttribute('data-claim');
    var sw = el.getAttribute('data-swap-date'), swSend = el.getAttribute('data-swap-send'), swCancel = el.getAttribute('data-swap-cancel');
    if (sw) { openSwapPicker(sw, el.getAttribute('data-swap-start')); return; }
    if (swCancel) { var sl = $('swap-' + swCancel); if (sl) sl.innerHTML = ''; return; }
    if (swSend) {
      var who = $('swap-who-' + swSend), their = $('swap-their-' + swSend), msg2 = $('swap-msg-' + swSend);
      var c = (_colleagues || [])[+(who ? who.value : -1)], s = c && their && their.value !== '' ? c.shifts[+their.value] : null;
      if (!c || !s) { if (msg2) msg2.textContent = 'Pick a colleague and one of their shifts.'; return; }
      el.disabled = true; if (msg2) msg2.textContent = '';
      post('/staff/api/shift-requests', {kind: 'swap', date: swSend, shift_start: el.getAttribute('data-swap-start'), target_name: c.name, target_date: s.date, target_start: s.shift_start, reason: ($('swap-why-' + swSend) || {}).value || ''})
        .then(function (d) { el.disabled = false; if (!d.ok) { if (msg2) msg2.textContent = d.error || 'Could not send that.'; return; } var sl2 = $('swap-' + swSend); if (sl2) sl2.innerHTML = '<div class="swap-pick"><div class="meta">Asked ✓ — both shifts move once your manager approves and your colleague says yes.</div></div>'; loadRequests(); })
        .catch(function () { el.disabled = false; if (msg2) msg2.textContent = 'Could not send that — check your connection.'; });
      return;
    }
    if (drop) {
      var reason = window.prompt('Why can\u2019t you work this shift? (optional)', '');
      if (reason === null) return;
      el.disabled = true;
      post('/staff/api/shift-requests', {date: drop, shift_start: el.getAttribute('data-drop-start'), reason: reason})
        .then(function (d) { el.disabled = false; if (!d.ok) { inlineMsg(el, d.error || 'Could not send that.'); return; } inlineMsg(el, ''); el.textContent = 'Asked \u2713'; loadRequests(); })
        .catch(function () { el.disabled = false; inlineMsg(el, 'Could not send that \u2014 check your connection.'); });
    } else if (wd) {
      el.disabled = true;
      post('/staff/api/shift-requests/' + wd + '/withdraw').then(function (d) { if (!d.ok) { el.disabled = false; inlineMsg(el, d.error || 'Could not withdraw that.'); return; } loadRequests(); })
        .catch(function () { el.disabled = false; inlineMsg(el, 'Could not withdraw that \u2014 check your connection.'); });
    } else if (cl) {
      var msg = $('open-msg-' + cl); if (msg) msg.textContent = '';
      el.disabled = true;
      post('/staff/api/open-shifts/' + cl + '/claim').then(function (d) {
        if (!d.ok) { el.disabled = false; if (msg) msg.textContent = d.error || 'You can\u2019t take this one.'; return; }
        loadRequests();
        // The week now includes it; redraw the shifts.
        fetch('/staff/api/shifts').then(function (r) { return r.json(); }).then(renderShifts).catch(function () {});
      }).catch(function () { el.disabled = false; if (msg) msg.textContent = 'Could not claim that \u2014 check your connection.'; });
    }
  });

  // ── My availability ─────────────────────────────────────────────────────
  // The days you can't work, entered by you. Your manager's next draft
  // reads it. ES5 only.
  var AV_DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  function avRender(d) {
    var el = $('avail-body'); if (!el) return;
    var blocked = d.unavailable_days || [];
    var html = '<h2>My availability</h2><div class="meta" style="margin-bottom:8px">Tap the days you can\u2019t work. Your manager\u2019s next schedule reads this.</div><div class="av-days">';
    for (var i = 0; i < AV_DAYS.length; i++) {
      var on = blocked.indexOf(AV_DAYS[i]) >= 0;
      html += '<button type="button" class="cbtn ' + (on ? 'cbtn-primary' : 'cbtn-secondary') + ' cbtn-sm av-day' + (on ? ' on' : '') + '" data-day="' + AV_DAYS[i] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + AV_DAYS[i].slice(0, 3) + '</button>';
    }
    html += '</div><input type="text" id="avail-notes" maxlength="300" placeholder="Anything else \u2014 \u201cnot before 10am\u201d, \u201caway Oct 3\u20136\u201d" value="' + esc(d.notes || '') + '">'
          + '<div class="av-row"><button type="button" class="cbtn cbtn-primary cbtn-sm" id="avail-save">Save</button><span class="meta" id="avail-status">' + (d.updated_at ? 'Last saved ' + mdyShort(String(d.updated_at).slice(0, 10)) : '') + '</span></div>';
    el.innerHTML = html;
    var btns = el.querySelectorAll('.av-day');
    for (var j = 0; j < btns.length; j++) btns[j].onclick = function () {
      var on = this.className.indexOf(' on') < 0;
      this.className = 'cbtn ' + (on ? 'cbtn-primary' : 'cbtn-secondary') + ' cbtn-sm av-day' + (on ? ' on' : '');
      this.setAttribute('aria-pressed', on ? 'true' : 'false');
    };
    $('avail-save').onclick = function () {
      var picked = [], all = el.querySelectorAll('.av-day.on');
      for (var k = 0; k < all.length; k++) picked.push(all[k].getAttribute('data-day'));
      var st = $('avail-status'); st.textContent = 'Saving\u2026';
      fetch('/staff/api/availability', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({unavailable_days: picked, notes: $('avail-notes').value})})
        .then(function (r) { return r.json(); })
        .then(function (r) { st.textContent = r.ok ? 'Saved \u2014 your manager\u2019s next schedule will use it.' : (r.error || 'Could not save.'); })
        .catch(function () { st.textContent = 'Could not save \u2014 check your connection.'; });
    };
  }
  fetch('/staff/api/availability').then(function (r) { return r.json(); }).then(function (d) { if (d && d.ok) avRender(d); }).catch(function () {});

  // ── What I'd like ───────────────────────────────────────────────────────
  // Preferred dayparts and hours a week, in your own words. The draft reads
  // it as a wish: honoured where coverage allows, never over a rule. ES5 only.
  function prefRender(d) {
    var el = $('pref-body'); if (!el) return;
    var picked = d.preferred_dayparts || [];
    var html = '<h2>What I’d like</h2><div class="meta" style="margin-bottom:4px">The shifts you’d rather have, and how many hours a week you want.</div><div class="pref-row">';
    var parts = [['morning', 'Days'], ['night', 'Nights']];
    for (var i = 0; i < parts.length; i++) {
      var on = picked.indexOf(parts[i][0]) >= 0;
      html += '<button type="button" class="cbtn ' + (on ? 'cbtn-primary' : 'cbtn-secondary') + ' cbtn-sm pref-dp' + (on ? ' on' : '') + '" data-dp="' + parts[i][0] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + parts[i][1] + '</button>';
    }
    html += '</div><div class="pref-hrs"><label for="pref-hours" class="meta" style="margin:0">Hours a week</label><input type="number" id="pref-hours" min="0" max="80" step="1" inputmode="numeric" value="' + (d.desired_hours == null ? '' : esc(d.desired_hours)) + '" placeholder="—"></div>'
          + '<div class="av-row"><button type="button" class="cbtn cbtn-primary cbtn-sm" id="pref-save">Save</button><span class="meta" id="pref-status"></span></div>'
          + '<div class="pref-note">A wish, not a rule — the schedule honours it where coverage allows.</div>';
    el.innerHTML = html;
    var btns = el.querySelectorAll('.pref-dp');
    for (var j = 0; j < btns.length; j++) btns[j].onclick = function () {
      var on = this.className.indexOf(' on') < 0;
      this.className = 'cbtn ' + (on ? 'cbtn-primary' : 'cbtn-secondary') + ' cbtn-sm pref-dp' + (on ? ' on' : '');
      this.setAttribute('aria-pressed', on ? 'true' : 'false');
    };
    $('pref-save').onclick = function () {
      var dps = [], all = el.querySelectorAll('.pref-dp.on');
      for (var k = 0; k < all.length; k++) dps.push(all[k].getAttribute('data-dp'));
      var hv = $('pref-hours').value, st = $('pref-status'); st.textContent = 'Saving…';
      fetch('/staff/api/preferences', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({preferred_dayparts: dps, desired_hours: hv === '' ? null : +hv})})
        .then(function (r) { return r.json(); })
        .then(function (r) { st.textContent = r.ok ? 'Saved — the next draft reads it.' : (r.error || 'Could not save.'); })
        .catch(function () { st.textContent = 'Could not save — check your connection.'; });
    };
  }
  fetch('/staff/api/preferences').then(function (r) { return r.json(); }).then(function (d) { if (d && d.ok) prefRender(d); }).catch(function () {});

  // ── Time off ────────────────────────────────────────────────────────────
  // Specific dates, asked for here and answered by a manager. An approved
  // range is a hard constraint on the next schedule draft. ES5 only.
  function toRender(d) {
    var el = $('timeoff-body'); if (!el) return;
    var reqs = d.requests || [];
    var html = '<h2>Time off</h2><div class="meta" style="margin-bottom:8px">Ask for specific dates. Your manager answers here, and an approved range is kept off the next schedule.</div>';
    for (var i = 0; i < reqs.length; i++) { var q = reqs[i];
      if (q.status === 'withdrawn') continue;
      var when = q.start_date === q.end_date ? fmtShort(q.start_date) : (fmtShort(q.start_date) + ' \u2013 ' + fmtShort(q.end_date));
      var st = q.status === 'approved' ? 'Approved' : (q.status === 'denied' ? 'Not approved' : 'Waiting for an answer');
      // A pending request can be taken back and asked again with the right
      // dates (MOD-EMP-7).
      html += '<div class="to-row"><span>' + when + (q.reason ? ' <span class="meta">\u00b7 ' + esc(q.reason) + '</span>' : '') + '</span><span class="to-st to-' + esc(q.status) + '">' + st + (q.decision_note ? ' \u00b7 ' + esc(q.decision_note) : '') + '</span>'
            + (q.status === 'pending' ? '<button type="button" class="cbtn cbtn-text cbtn-sm" data-to-withdraw="' + (+q.id) + '">Withdraw</button>' : '') + '</div>';
    }
    html += '<div class="av-row" style="flex-wrap:wrap"><input type="date" id="to-start" aria-label="First day off"><input type="date" id="to-end" aria-label="Last day off"><input type="text" id="to-reason" maxlength="200" placeholder="Reason (optional)" style="flex:1;min-width:140px"></div>'
          + '<div class="av-row"><button type="button" class="cbtn cbtn-primary cbtn-sm" id="to-send">Request</button><span class="meta" id="to-status"></span></div>';
    el.innerHTML = html;
    var wds = el.querySelectorAll('[data-to-withdraw]');
    for (var w = 0; w < wds.length; w++) {
      wds[w].onclick = function () {
        var b = this; b.disabled = true;
        fetch('/staff/api/time-off/' + b.getAttribute('data-to-withdraw') + '/withdraw', {method: 'POST'})
          .then(function (r) { return r.json(); })
          .then(function (r) { if (r.ok) { loadTimeOff(); } else { b.disabled = false; $('to-status').textContent = r.error || 'Could not withdraw that.'; } })
          .catch(function () { b.disabled = false; });
      };
    }
    $('to-send').onclick = function () {
      var btn = this, st = $('to-status'); var s0 = $('to-start').value, e0 = $('to-end').value || s0;
      if (!s0) { st.textContent = 'Pick the first day.'; return; }
      // One request per tap: the button is off while it is in flight.
      btn.disabled = true;
      st.textContent = 'Sending\u2026';
      fetch('/staff/api/time-off', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({start_date: s0, end_date: e0, reason: $('to-reason').value})})
        .then(function (r) { return r.json(); })
        .then(function (r) { btn.disabled = false; if (r.ok) { loadTimeOff(); } else { st.textContent = r.error || 'Could not send.'; } })
        .catch(function () { btn.disabled = false; st.textContent = 'Could not send \u2014 check your connection.'; });
    };
  }
  function loadTimeOff() {
    fetch('/staff/api/time-off').then(function (r) { return r.json(); }).then(function (d) { if (d && d.ok) toRender(d); }).catch(function () {});
  }
  loadTimeOff();

  // ── Tasks ───────────────────────────────────────────────────────────────
  function loadTasks(){
    fetch('/staff/api/tasks').then(function(r){ return r.json(); }).then(function(d){
      var el = $('tasks-body');
      if (!d.ok) { el.className = 'err'; el.textContent = d.error || 'Could not load your tasks.'; return; }
      el.className = '';
      taskDate = d.task_date || '';
      if (!d.role) {
        el.innerHTML = '<div class="empty">Your job role isn’t set yet, so there’s no checklist to show. '
                     + 'A manager can set it from the dashboard.</div>';
        return;
      }
      if (!d.tasks.length) {
        el.innerHTML = '<div class="empty">Nothing on the ' + esc(d.role) + ' checklist today.</div>';
        return;
      }
      var done = 0;
      for (var i = 0; i < d.tasks.length; i++) if (d.tasks[i].done) done++;
      var html = '<h2>' + esc(d.role) + ' · today</h2>'
               + '<div class="progress">' + done + ' of ' + d.tasks.length + ' done</div>'
               + '<div class="sr-msg" id="task-msg" role="status"></div>';
      for (var j = 0; j < d.tasks.length; j++) {
        var t = d.tasks[j];
        html += '<label class="task' + (t.done ? ' done' : '') + '">'
              + '<input type="checkbox" data-task="' + t.id + '"' + (t.done ? ' checked' : '') + '>'
              + '<span>' + esc(t.label) + '</span></label>';
      }
      el.innerHTML = html;
    }).catch(function(){
      $('tasks-body').className = 'err';
      $('tasks-body').textContent = 'Could not load your tasks.';
    });
  }
  loadTasks();

  document.addEventListener('change', function(ev){
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var id = el.getAttribute('data-task');
    if (id === null) return;
    var want = el.checked;
    function refused(text){
      /* Put the box back the way the server has it, and say why. */
      el.checked = !want;
      var m = $('task-msg'); if (m) m.textContent = text;
    }
    fetch('/staff/api/tasks/complete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({template_id: parseInt(id, 10), task_date: today(), done: want})
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok) { refused(d.error || 'That didn\u2019t save \u2014 try again.'); return; }
      loadTasks();
    }).catch(function(){ refused('That didn\u2019t save \u2014 check your connection.'); });
  });

  // ── Profile ─────────────────────────────────────────────────────────────
  fetch('/staff/api/me').then(function(r){ return r.json(); }).then(function(d){
    var el = $('profile-body');
    if (!d.ok) { el.className = 'err'; el.textContent = 'Could not load your profile.'; return; }
    el.className = '';
    el.innerHTML = '<div class="row"><span class="k">Name</span><span class="v">' + esc(d.employee.name) + '</span></div>'
                 + '<div class="row"><span class="k">Restaurant</span><span class="v">' + esc(d.employee.restaurant) + '</span></div>';
  }).catch(function(){
    $('profile-body').className = 'err';
    $('profile-body').textContent = 'Could not load your profile.';
  });

  window.savePin = function(){
    var msg = $('pinmsg');
    msg.style.color = 'var(--red)';
    if ($('nw').value !== $('nw2').value) { msg.textContent = 'The two new PINs don’t match.'; return; }
    fetch('/staff/api/pin', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({current_pin: $('cur').value, new_pin: $('nw').value})
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok) { msg.textContent = d.error || 'Could not change your PIN.'; return; }
      msg.style.color = 'var(--green)';
      msg.textContent = 'PIN changed. Signing you back in…';
      setTimeout(function(){
        fetch('/staff/logout', {method: 'POST'}).then(function(){ window.location = '/staff/'; })
          .catch(function(){ window.location = '/staff/'; });
      }, 1400);
    }).catch(function(){ msg.textContent = 'Could not change your PIN.'; });
  };
})();
</script>
</body>
</html>
