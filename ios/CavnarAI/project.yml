name: CavnarAI
options:
  bundleIdPrefix: ai.cavnar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  CavnarAI:
    type: application
    platform: iOS
    sources:
      - path: CavnarAI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cavnar AI
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces.ttf
          - PlusJakartaSans.ttf
          - SpaceGrotesk.ttf
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: "Cavnar AI uses Face ID to keep your restaurant's data secure when you return to the app."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/CavnarAI.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cavnar.CavnarAI
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete

  CavnarAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CavnarAITests
    dependencies:
      - target: CavnarAI
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  CavnarAI:
    build:
      targets:
        CavnarAI: all
        CavnarAITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CavnarAITests
