name: CavnarAI
options:
  bundleIdPrefix: ai.cavnar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  CavnarAI:
    type: application
    platform: iOS
    sources:
      - path: CavnarAI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cavnar AI
        UILaunchScreen:
          UIColorName: Paper
          # A faint ghost of the ring only — RootView's LaunchSplashView
          # draws the real ring in over this exact spot on the first frame.
          UIImageName: LaunchGhost
        UIAppFonts:
          - ApfelGrotezk-Regular.ttf
          - ApfelGrotezk-Fett.ttf
          - ClashDisplay-Regular.ttf
          - ClashDisplay-Medium.ttf
          - ClashDisplay-Semibold.ttf
          - ClashDisplay-Bold.ttf
          - SpaceGrotesk.ttf
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: "Cavnar AI uses Face ID to keep your restaurant's data secure when you return to the app."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.cavnar.CavnarAI.auth
            CFBundleURLSchemes:
              - cavnarai
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIconLight:
              CFBundleIconFiles:
                - AppIconLight
              UIPrerenderedIcon: false
    entitlements:
      path: Generated/CavnarAI.entitlements
      properties:
        # Tracks the build configuration. Hardcoding `development` meant a
        # Release/TestFlight build registered tokens against the sandbox APNs
        # namespace while PushManager reported "production" — the two
        # namespaces are separate, so every production push silently failed
        # with no error anywhere (audit 1.8).
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cavnar.CavnarAI
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8DW8XL63K6
        # Real devices require a valid signature, no exceptions — only
        # Simulator builds skip signing (keeps automated Simulator-only
        # builds/tests working without an Apple ID attached to Xcode here).
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APS_ENVIRONMENT: development
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Release:
          APS_ENVIRONMENT: production

  CavnarAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CavnarAITests
    dependencies:
      - target: CavnarAI
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  CavnarAI:
    build:
      targets:
        CavnarAI: all
        CavnarAITests: [test]
    run:
      config: Debug
      # Local-dev backend override. The VALUE is deliberately not committed:
      # it is a public, unauthenticated ngrok tunnel to a Mac serving live
      # client data, and an address like that in version control is an
      # access path for anyone who reads the repo (audit 1.1).
      #
      # xcodegen substitutes ${CAVNAR_DEV_API_BASE_URL} from the shell at
      # generate time, so export it once in ~/.zshrc and every regenerate
      # picks it up — which is the problem the old committed value was
      # solving (xcodegen rebuilds the .xcscheme on every run and drops
      # anything set by hand in Xcode's scheme editor):
      #
      #   export CAVNAR_DEV_API_BASE_URL="https://<your-tunnel>.ngrok-free.app"
      #
      # Unset is safe: the placeholder passes through unsubstituted and
      # AppEnvironment rejects it, falling back to the compiled default —
      # but that fallback (localhost:5000) is silently unreachable from a
      # physical device, and "safe" only means it doesn't crash, not that
      # the failure is obvious (see AppEnvironment's NSLog + RootView's
      # on-screen tripwire for when it does happen). This has already bitten
      # a `xcodegen generate` run from a shell that doesn't source ~/.zshrc
      # (an agent/tool's own shell, not just a plain interactive Terminal) —
      # that silently overwrites a working scheme's real tunnel URL back to
      # this literal placeholder. Run `source ~/.zshrc` first if generating
      # from anywhere other than an ordinary interactive terminal window.
      #
      # Port 5000, not 5050, is macOS's own AirPlay Receiver (ControlCenter
      # process) — it silently answers with a blank 403 Forbidden for any
      # non-AirPlay request instead of a "connection refused", which reads
      # exactly like a real API error. Keep the local dev server on 5050.
      environmentVariables:
        CAVNAR_API_BASE_URL: "${CAVNAR_DEV_API_BASE_URL}"
    test:
      config: Debug
      targets:
        - CavnarAITests
