name: CavnarAI
options:
  bundleIdPrefix: ai.cavnar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  CavnarAI:
    type: application
    platform: iOS
    sources:
      - path: CavnarAI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Cavnar AI
        UILaunchScreen:
          UIColorName: Paper
          # A faint ghost of the ring only — RootView's LaunchSplashView
          # draws the real ring in over this exact spot on the first frame.
          UIImageName: LaunchGhost
        UIAppFonts:
          - ApfelGrotezk-Regular.ttf
          - ApfelGrotezk-Fett.ttf
          - ClashDisplay-Regular.ttf
          - ClashDisplay-Medium.ttf
          - ClashDisplay-Semibold.ttf
          - ClashDisplay-Bold.ttf
          - SpaceGrotesk.ttf
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: "Cavnar AI uses Face ID to keep your restaurant's data secure when you return to the app."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.cavnar.CavnarAI.auth
            CFBundleURLSchemes:
              - cavnarai
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIconLight:
              CFBundleIconFiles:
                - AppIconLight
              UIPrerenderedIcon: false
    entitlements:
      path: Generated/CavnarAI.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cavnar.CavnarAI
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8DW8XL63K6
        # Real devices require a valid signature, no exceptions — only
        # Simulator builds skip signing (keeps automated Simulator-only
        # builds/tests working without an Apple ID attached to Xcode here).
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete

  CavnarAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CavnarAITests
    dependencies:
      - target: CavnarAI
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  CavnarAI:
    build:
      targets:
        CavnarAI: all
        CavnarAITests: [test]
    run:
      config: Debug
      # Local-dev backend override — checked into project.yml (not set by
      # hand in Xcode's scheme editor) specifically because `xcodegen
      # generate` rebuilds the .xcscheme from this file on every run and
      # silently drops anything not declared here. Update the IP if the
      # Mac's LAN address changes; still overridable by hand in Xcode for a
      # one-off run (that override just won't survive the next regenerate).
      # Port 5000, not 5050, is macOS's own AirPlay Receiver (ControlCenter
      # process) — it silently answers with a blank 403 Forbidden for any
      # non-AirPlay request instead of a "connection refused", which reads
      # exactly like a real API error. Keep the local dev server on 5050.
      #
      # Pointed at the ngrok tunnel, not the home LAN IP, while testing off
      # the home network (e.g. Panera) — a LAN IP is only reachable from
      # devices on that same physical network, so it's not a "wrong IP"
      # problem away from home, it's a different-network problem. The
      # tunnel is a real public HTTPS URL, reachable from anywhere. Swap
      # back to the LAN IP for local-only testing once back on home wifi
      # (ngrok's free-tier URL also isn't stable across restarts).
      environmentVariables:
        CAVNAR_API_BASE_URL: "https://4f87-208-44-38-158.ngrok-free.app"
    test:
      config: Debug
      targets:
        - CavnarAITests
